<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
  </defs>
  <rect width="800" height="470" rx="12" fill="#ffffff"/>

  <!-- wordlines (inputs) -->
  <g stroke="#1971c2" stroke-width="4">
    <line x1="140" y1="90" x2="430" y2="90"/>
    <line x1="140" y1="180" x2="430" y2="180"/>
  </g>
  <g font-size="16" fill="#1971c2" font-weight="bold" text-anchor="end">
    <text x="130" y="95">Input 1</text>
    <text x="130" y="185">Input 2</text>
  </g>
  <text x="80" y="45" font-size="13" fill="#495057" text-anchor="middle">voltages in</text>

  <!-- bitlines -->
  <g stroke="#d9480f" stroke-width="4">
    <line x1="230" y1="60" x2="230" y2="300"/>
    <line x1="370" y1="60" x2="370" y2="300"/>
  </g>
  <g font-size="16" fill="#d9480f" font-weight="bold" text-anchor="middle">
    <text x="230" y="48">BL+</text>
    <text x="370" y="48">BL−</text>
  </g>

  <!-- memristors at crossings -->
  <g fill="#fff4e6" stroke="#212529" stroke-width="2">
    <rect x="205" y="74" width="50" height="32" rx="6"/>
    <rect x="345" y="74" width="50" height="32" rx="6"/>
    <rect x="205" y="164" width="50" height="32" rx="6"/>
    <rect x="345" y="164" width="50" height="32" rx="6"/>
  </g>
  <g font-size="15" fill="#212529" text-anchor="middle">
    <text x="230" y="96">G+₁</text>
    <text x="370" y="96">G−₁</text>
    <text x="230" y="186">G+₂</text>
    <text x="370" y="186">G−₂</text>
  </g>

  <!-- current arrows -->
  <g stroke="#d9480f" stroke-width="2.5" marker-end="url(#arrow)">
    <line x1="250" y1="215" x2="250" y2="255"/>
    <line x1="390" y1="215" x2="390" y2="255"/>
  </g>
  <g font-size="13" fill="#d9480f">
    <text x="258" y="242">currents add</text>
    <text x="398" y="242">currents add</text>
  </g>

  <!-- readouts -->
  <g fill="#e7f5ff" stroke="#212529" stroke-width="2">
    <rect x="170" y="300" width="120" height="52" rx="8"/>
    <rect x="310" y="300" width="120" height="52" rx="8"/>
  </g>
  <g font-size="14" fill="#212529" text-anchor="middle">
    <text x="230" y="322" font-weight="bold">Readout</text>
    <text x="230" y="340">holds 300 mV</text>
    <text x="370" y="322" font-weight="bold">Readout</text>
    <text x="370" y="340">holds 300 mV</text>
  </g>

  <!-- subtract -->
  <g stroke="#495057" stroke-width="2.5" fill="none" marker-end="url(#arrowg)">
    <path d="M230,352 L230,385 L285,385"/>
    <path d="M370,352 L370,385 L315,385"/>
  </g>
  <circle cx="300" cy="400" r="22" fill="#ebfbee" stroke="#212529" stroke-width="2"/>
  <text x="300" y="407" font-size="22" text-anchor="middle" fill="#212529">−</text>
  <line x1="300" y1="422" x2="300" y2="440" stroke="#495057" stroke-width="2.5"/>
  <text x="300" y="460" font-size="15" text-anchor="middle" fill="#212529" font-weight="bold">Output = Input 1 × w₁ + Input 2 × w₂</text>

  <!-- step labels -->
  <g font-size="14" fill="#212529">
    <text x="480" y="95"><tspan font-weight="bold">1  Multiply</tspan></text>
    <text x="480" y="114" fill="#495057">each cell passes input × G</text>
    <text x="480" y="175"><tspan font-weight="bold">2  Add</tspan></text>
    <text x="480" y="194" fill="#495057">currents on one wire sum</text>
    <text x="480" y="322"><tspan font-weight="bold">3  Read</tspan></text>
    <text x="480" y="341" fill="#495057">bitline pinned, current copied</text>
    <text x="480" y="400"><tspan font-weight="bold">4  Subtract</tspan></text>
    <text x="480" y="419" fill="#495057">weight w = G+ − G−  (can be negative)</text>
  </g>
</svg>
